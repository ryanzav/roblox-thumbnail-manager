name: Roblox Thumbnail Manager

on:
  schedule:
    # GitHub scheduled workflows use UTC, and are best-effort: they are queued
    # on shared infrastructure and dropped under load, so a short interval is
    # not honoured. A "*/10" cron here actually fired every 3-5 hours.
    # Hourly, away from the top of the hour, is about the fastest that runs
    # dependably.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roblox-thumbnail-manager
  cancel-in-progress: false

jobs:
  manage-thumbnails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run thumbnail manager
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          AI_IMAGE_API_KEY: ${{ secrets.AI_IMAGE_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: python -m src.main

      - name: Commit updated history, dashboard, and queue
        run: |
          git config user.name "roblox-thumbnail-bot"
          git config user.email "roblox-thumbnail-bot@users.noreply.github.com"

          git add data docs

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "Update thumbnail metrics and queue"

          # The checkout can be stale by the time the run finishes - a push
          # from elsewhere lands mid-run and the push is rejected. Rebase onto
          # whatever arrived and try again; metrics.csv only ever gains rows,
          # so a rebase cannot lose data.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main || exit 1
          done

          echo "Could not push after 3 attempts."
          exit 1
